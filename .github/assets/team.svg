  <line class="rule" x1="560" y1="80" x2="720" y2="80" stroke-width="2"/>
  <circle class="gold" cx="640" cy="80" r="4"/>

  <g transform="translate(400 0)">
    <rect class="person" x="-190" y="104" width="380" height="186" rx="22" stroke-width="2"/>
    <circle class="disc" cx="0" cy="170" r="44"/>
    <path d="M -36 134 A 52 52 0 0 0 -36 206" fill="none" stroke="#b42338" stroke-width="5" stroke-linecap="round"/>
    <path d="M 36 134 A 52 52 0 0 1 36 206" fill="none" stroke="#1f6e3e" stroke-width="5" stroke-linecap="round"/>
    <text class="initials" x="0" y="182" text-anchor="middle" font-size="34" letter-spacing="2">SS</text>
    <text class="name" x="0" y="256" text-anchor="middle" font-size="32">Slimane Sahnoune</text>
  </g>

  <g transform="translate(880 0)">
