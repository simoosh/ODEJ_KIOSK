  <text class="ar" x="640" y="334" text-anchor="middle" direction="rtl" font-size="24">ديوان مؤسسات الشباب لولاية بجاية</text>
  <text class="ui" x="640" y="362" text-anchor="middle" font-size="16" letter-spacing="1">ODEJ Béjaïa · Alger, 11 novembre 2026</text>
