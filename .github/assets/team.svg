    <circle class="disc" cx="0" cy="170" r="44"/>
    <path d="M -36 134 A 52 52 0 0 0 -36 206" fill="none" stroke="#b42338" stroke-width="5" stroke-linecap="round"/>
    <path d="M 36 134 A 52 52 0 0 1 36 206" fill="none" stroke="#1f6e3e" stroke-width="5" stroke-linecap="round"/>
    <text class="initials" x="0" y="182" text-anchor="middle" font-size="34" letter-spacing="2">AM</text>
    <text class="name" x="0" y="256" text-anchor="middle" font-size="32">Adam Mila</text>
