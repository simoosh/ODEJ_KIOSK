<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Équipe ODEJ_KIOSK</title>
  <desc id="desc">Slimane Sahnoune et Adam Mila.</desc>
  <style>
    .card { fill: #f7f6f1; stroke: #dedbd1; }
    .person { fill: #ffffff; stroke: #dedbd1; }
    .contour { fill: none; stroke: #1f6e3e; stroke-opacity: 0.09; stroke-width: 2; }
    .disc { fill: #e5efe5; }
    .initials { fill: #1f6e3e; font-family: 'Marcellus', 'Cormorant Garamond', Georgia, serif; }
    .name { fill: #14211b; font-family: 'Marcellus', 'Cormorant Garamond', Georgia, serif; }
    .ar { fill: #48544e; font-family: 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', 'Segoe UI', serif; }
    .ui { fill: #48544e; font-family: 'Readex Pro', 'Segoe UI', Tahoma, system-ui, sans-serif; }
    .gold { fill: #86670c; }
    .rule { stroke: #86670c; stroke-opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #14211b; stroke: #2c3a33; }
      .person { fill: #1a2a22; stroke: #2c3a33; }
      .contour { stroke: #7dba83; stroke-opacity: 0.12; }
      .disc { fill: #1f3a2a; }
      .initials { fill: #a9d6ad; }
      .name { fill: #f7f6f1; }
      .ar, .ui { fill: #c9cfc9; }
      .gold { fill: #d6b45a; }
      .rule { stroke: #d6b45a; }
    }
  </style>

  <rect class="card" x="1" y="1" width="1278" height="378" rx="28" stroke-width="2"/>

